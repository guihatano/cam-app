<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Câmera</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0d0d;
      color: #eee;
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      gap: 16px;
    }

    h1 {
      font-size: 1rem;
      font-weight: 500;
      color: #888;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 4px;
      background: #161616;
      border-radius: 8px;
      padding: 4px;
    }

    .tab {
      padding: 7px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      color: #666;
      border: none;
      background: transparent;
      transition: all 0.15s;
    }

    .tab.active { background: #222; color: #eee; }

    /* Panels */
    .panel { display: none; width: 100%; max-width: 960px; }
    .panel.active { display: flex; flex-direction: column; gap: 16px; align-items: center; }
    /* O ao vivo usa a largura toda; layoutLive() limita pelo espaço disponível */
    #panel-live { max-width: none; }

    /* Video: a câmera manda as duas lentes empilhadas num frame só (16:18).
       Cada .cam é um quadro 16:9 que mostra uma metade do mesmo stream. */
    .video-wrapper {
      width: 100%;
      max-width: 100%;
      position: relative;
      display: grid;
      grid-template-columns: 1fr;
      gap: 2px;
      background: #111;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 32px rgba(0,0,0,0.6);
    }
    .video-wrapper[data-layout="side"] { grid-template-columns: 1fr 1fr; }
    .video-wrapper.expanded { grid-template-columns: 1fr; }
    .video-wrapper.expanded .cam:not(.focus) { display: none; }

    .cam {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #111;
      cursor: zoom-in;
    }
    .video-wrapper.expanded .cam { cursor: zoom-out; }

    .feed {
      position: absolute;
      left: 0;
      width: 100%;
      height: 200%;
      display: block;
    }
    /* transform-origin no centro da metade visível, para o zoom digital */
    .cam[data-cam="top"] .feed { top: 0; transform-origin: 50% 25%; }
    .cam[data-cam="bottom"] .feed { top: -100%; transform-origin: 50% 75%; }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      font-size: 0.9rem;
      color: #555;
    }

    .overlay.hidden { display: none; }

    /* Controls */
    .controls { display: flex; gap: 12px; }

    button {
      background: #222;
      border: 1px solid #333;
      color: #ccc;
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.15s;
    }

    button:hover { background: #2e2e2e; color: #fff; }
    button:disabled { opacity: 0.4; cursor: default; }

    /* PTZ pad (câmera de baixo) e zoom (câmera de cima) — canto inferior esquerdo */
    .ptz-wrap, .zoom-wrap {
      position: absolute;
      left: 12px;
      bottom: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      backdrop-filter: blur(3px);
      opacity: 0.55;
      transition: opacity 0.15s;
      z-index: 5;
    }
    .ptz-wrap:hover, .zoom-wrap:hover { opacity: 1; }
    .ptz {
      display: grid;
      grid-template-columns: repeat(3, 34px);
      grid-template-rows: repeat(3, 34px);
      gap: 4px;
    }
    .ptz-zoom { display: flex; flex-direction: column; gap: 4px; }
    .ptz-btn {
      background: rgba(28, 28, 28, 0.85);
      border: 1px solid #3a3a3a;
      color: #ddd;
      border-radius: 7px;
      font-size: 0.95rem;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      transition: background 0.1s;
    }
    .ptz-zoom .ptz-btn { width: 34px; height: 34px; font-size: 1.1rem; }
    .ptz-btn:active { background: #2e7d32; color: #fff; border-color: #2e7d32; }
    .ptz-center { color: #555; cursor: default; }
    .ptz-center:active { background: rgba(28,28,28,0.85); color: #555; border-color: #3a3a3a; }

    .logout {
      position: fixed; top: 12px; right: 14px;
      font-size: 0.75rem; color: #777; text-decoration: none;
      border: 1px solid #2a2a2a; border-radius: 6px; padding: 5px 12px;
      background: #161616; transition: all 0.15s;
    }
    .logout:hover { color: #eee; border-color: #444; }

    .status { font-size: 0.75rem; color: #555; }

    .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #444;
      margin-right: 6px;
      transition: background 0.3s;
    }

    .dot.live { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }

    /* Recordings panel */
    .rec-toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      width: 100%;
    }

    .rec-toolbar input[type="date"] {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #eee;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .rec-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .rec-item {
      background: #161616;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .rec-time {
      font-size: 0.85rem;
      color: #ccc;
    }

    .rec-time span { color: #666; font-size: 0.75rem; margin-left: 8px; }

    .rec-actions { display: flex; gap: 8px; flex-shrink: 0; }

    .rec-actions button {
      padding: 6px 14px;
      font-size: 0.8rem;
    }

    .rec-empty {
      text-align: center;
      color: #444;
      padding: 40px 0;
      font-size: 0.9rem;
    }

    /* Playback */
    .playback-wrapper {
      width: 100%;
      position: relative;
      background: #111;
      border-radius: 8px;
      overflow: hidden;
    }

    #playback-feed { width: 100%; display: block; }

    .playback-info {
      font-size: 0.8rem;
      color: #555;
      text-align: center;
    }
  </style>
</head>
<body>

  <a href="/logout" class="logout" title="Sair">Sair</a>

  <h1>Câmera IP</h1>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('live')">Ao vivo</button>
    <button class="tab" onclick="switchTab('recordings')">Gravações</button>
  </div>

  <!-- Live panel -->
  <div class="panel active" id="panel-live">
    <!-- Toque/clique numa câmera para ampliar; de novo para voltar às duas -->
    <div class="video-wrapper" id="cams" data-layout="stacked">
      <div class="cam" data-cam="top">
        <img class="feed" alt="Câmera de cima" />
        <div class="zoom-wrap">
          <div class="ptz-zoom">
            <button class="ptz-btn" data-zoom="in" title="Zoom digital +">+</button>
            <button class="ptz-btn" data-zoom="out" title="Zoom digital −">−</button>
          </div>
        </div>
      </div>

      <div class="cam" data-cam="bottom">
        <img class="feed" alt="Câmera de baixo (móvel)" />
        <!-- PTZ: a lente de baixo é a que se move. Segure para mover -->
        <div class="ptz-wrap">
          <div class="ptz" id="ptz-pad">
            <button class="ptz-btn" data-dir="upleft">↖</button>
            <button class="ptz-btn" data-dir="up">↑</button>
            <button class="ptz-btn" data-dir="upright">↗</button>
            <button class="ptz-btn" data-dir="left">←</button>
            <button class="ptz-btn ptz-center" disabled>⊕</button>
            <button class="ptz-btn" data-dir="right">→</button>
            <button class="ptz-btn" data-dir="downleft">↙</button>
            <button class="ptz-btn" data-dir="down">↓</button>
            <button class="ptz-btn" data-dir="downright">↘</button>
          </div>
          <div class="ptz-zoom">
            <button class="ptz-btn" data-zoom="in" title="Zoom digital +">+</button>
            <button class="ptz-btn" data-zoom="out" title="Zoom digital −">−</button>
          </div>
        </div>
      </div>

      <div class="overlay" id="overlay">Conectando...</div>
    </div>

    <div class="controls">
      <button onclick="snapshot()">Salvar foto</button>
      <button onclick="reloadStream()">Reconectar</button>
      <button id="quality-btn" onclick="toggleQuality()" title="Alternar qualidade do ao vivo"></button>
    </div>

    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="status-text">Aguardando stream...</span>
    </div>
  </div>

  <!-- Recordings panel -->
  <div class="panel" id="panel-recordings">
    <div class="rec-toolbar">
      <input type="date" id="rec-date" />
      <button onclick="loadRecordings()">Buscar</button>
    </div>

    <div class="rec-list" id="rec-list">
      <div class="rec-empty">Selecione uma data e clique em Buscar.</div>
    </div>

    <!-- Playback inline -->
    <div id="playback-section" style="display:none; width:100%; flex-direction:column; gap:8px; align-items:center;">
      <div class="playback-wrapper">
        <video id="playback-feed" controls playsinline style="width:100%; display:block;"></video>
        <div class="overlay" id="playback-overlay">Preparando gravação...</div>
      </div>
      <div class="playback-info" id="playback-info"></div>
      <button onclick="stopPlayback()">Fechar</button>
    </div>
  </div>

  <script>
    // ── Tab switching ──────────────────────────────
    function switchTab(name) {
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', ['live','recordings'][i] === name);
      });
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-' + name).classList.add('active');
      currentTab = name;
      updateLive();
      layoutLive();
    }

    // ── Live stream ───────────────────────────────
    // As duas <img> usam a mesma URL: o navegador reaproveita a mesma conexão
    // e cada uma mostra uma metade do frame (lente de cima / de baixo).
    const feeds = document.querySelectorAll('.feed');
    const overlay = document.getElementById('overlay');
    const dot = document.getElementById('dot');
    const statusText = document.getElementById('status-text');

    function onLoad() {
      overlay.classList.add('hidden');
      dot.classList.add('live');
      statusText.textContent = 'Ao vivo';
    }

    function onError() {
      if (!liveActive) return;
      overlay.classList.remove('hidden');
      overlay.textContent = 'Sem sinal — tentando reconectar...';
      dot.classList.remove('live');
      statusText.textContent = 'Reconectando...';
      setTimeout(() => { if (liveActive) reloadStream(); }, 3000);
    }

    feeds[0].addEventListener('load', onLoad);
    feeds[0].addEventListener('error', onError);

    function reloadStream() {
      const url = '/stream?q=' + quality + '&t=' + Date.now();
      feeds.forEach(f => { f.src = url; });
    }

    // ── Layout: empilhado ou lado a lado, o que der a imagem maior ──
    // Cada lente é 16:9. Empilhado = 16x18, lado a lado = 32x9, ampliada = 16x9.
    // Encaixa na altura da janela para as duas câmeras aparecerem sem rolar.
    const cams = document.getElementById('cams');
    const panelLive = document.getElementById('panel-live');
    const belowCams = [panelLive.querySelector('.controls'), panelLive.querySelector('.status')];
    let expandedCam = null;  // 'top' | 'bottom' | null

    function layoutLive() {
      if (currentTab !== 'live') return;
      const W = panelLive.clientWidth;
      const top = cams.getBoundingClientRect().top + window.scrollY;
      const below = belowCams.reduce((h, el) => h + el.offsetHeight + 16, 0) + 24;
      const H = Math.max(window.innerHeight - top - below, 180);
      let cols, rows;
      if (expandedCam) {
        cols = 1; rows = 1;
      } else {
        const stacked = Math.min(W / 16, H / 18);
        const side = Math.min(W / 32, H / 9);
        [cols, rows] = side > stacked ? [2, 1] : [1, 2];
      }
      const unit = Math.min(W / (16 * cols), H / (9 * rows));
      cams.dataset.layout = cols === 2 ? 'side' : 'stacked';
      cams.style.width = Math.floor(unit * 16 * cols) + 'px';
    }
    window.addEventListener('resize', layoutLive);

    cams.addEventListener('click', (e) => {
      if (e.target.closest('.ptz-wrap, .zoom-wrap')) return;
      const cam = e.target.closest('.cam');
      if (!cam) return;
      expandedCam = expandedCam ? null : cam.dataset.cam;
      cams.classList.toggle('expanded', !!expandedCam);
      cams.querySelectorAll('.cam').forEach(c =>
        c.classList.toggle('focus', c.dataset.cam === expandedCam));
      layoutLive();
    });

    // Qualidade: SD = substream (leve), HD = stream principal reduzido (mais CPU no servidor)
    const qualityBtn = document.getElementById('quality-btn');
    let quality = 'sd';
    try { if (localStorage.getItem('quality') === 'hd') quality = 'hd'; } catch (e) {}
    function renderQuality() {
      qualityBtn.textContent = 'Qualidade: ' + quality.toUpperCase();
    }
    function toggleQuality() {
      quality = quality === 'sd' ? 'hd' : 'sd';
      try { localStorage.setItem('quality', quality); } catch (e) {}
      renderQuality();
      if (liveActive) {
        overlay.classList.remove('hidden');
        overlay.textContent = 'Conectando...';
        reloadStream();
      }
    }

    // Só mantém o stream aberto com a aba "Ao vivo" visível: sem espectadores,
    // o servidor para de decodificar a câmera (economiza CPU).
    let currentTab = 'live';
    let liveActive = false;
    function updateLive() {
      const want = currentTab === 'live' && !document.hidden;
      if (want === liveActive) return;
      liveActive = want;
      if (want) {
        overlay.classList.remove('hidden');
        overlay.textContent = 'Conectando...';
        reloadStream();
      } else {
        feeds.forEach(f => f.removeAttribute('src'));
        dot.classList.remove('live');
        statusText.textContent = 'Pausado';
      }
    }
    document.addEventListener('visibilitychange', updateLive);
    renderQuality();
    layoutLive();
    updateLive();  // inicia o stream (se a aba estiver visível)

    function snapshot() {
      const a = document.createElement('a');
      a.href = '/snapshot?' + Date.now();
      a.download = 'camera_' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.jpg';
      a.click();
    }

    // ── PTZ (segurar para mover) ──────────────────
    let ptzMoving = false;
    function ptzStart(dir) {
      ptzMoving = true;
      fetch('/ptz/move?dir=' + dir).catch(() => {});
    }
    function ptzStop() {
      if (!ptzMoving) return;
      ptzMoving = false;
      fetch('/ptz/stop').catch(() => {});
    }
    document.querySelectorAll('.ptz-btn[data-dir]').forEach(btn => {
      const dir = btn.dataset.dir;
      const start = (e) => { e.preventDefault(); ptzStart(dir); };
      btn.addEventListener('mousedown', start);
      btn.addEventListener('touchstart', start, { passive: false });
      ['mouseup', 'mouseleave', 'touchend', 'touchcancel'].forEach(ev =>
        btn.addEventListener(ev, ptzStop));
    });
    // garante parada se soltar fora do botão
    window.addEventListener('mouseup', ptzStop);
    window.addEventListener('touchend', ptzStop);

    // ── Zoom digital (a câmera não tem zoom óptico) ──
    // Zoom independente por câmera (o transform-origin de cada uma está no CSS).
    const zoomLevels = { top: 1, bottom: 1 };
    const ZOOM_MAX = 4, ZOOM_STEP = 1.3;
    document.querySelectorAll('[data-zoom]').forEach(btn => {
      btn.addEventListener('click', () => {
        const cam = btn.closest('.cam');
        const name = cam.dataset.cam;
        zoomLevels[name] = btn.dataset.zoom === 'in'
          ? Math.min(zoomLevels[name] * ZOOM_STEP, ZOOM_MAX)
          : Math.max(zoomLevels[name] / ZOOM_STEP, 1);
        cam.querySelector('.feed').style.transform =
          zoomLevels[name] > 1 ? 'scale(' + zoomLevels[name].toFixed(3) + ')' : '';
      });
    });

    // ── Recordings ────────────────────────────────
    let currentRecordings = [];
    const recDateInput = document.getElementById('rec-date');
    recDateInput.value = new Date().toISOString().slice(0,10);

    async function loadRecordings() {
      const date = recDateInput.value;
      const list = document.getElementById('rec-list');
      list.innerHTML = '<div class="rec-empty">Buscando...</div>';

      try {
        const resp = await fetch('/api/recordings?date=' + date);
        const data = await resp.json();

        if (data.error) {
          list.innerHTML = `<div class="rec-empty">Erro: ${data.error}</div>`;
          return;
        }

        if (!data.recordings.length) {
          list.innerHTML = '<div class="rec-empty">Nenhuma gravação encontrada nesta data.</div>';
          return;
        }

        currentRecordings = data.recordings;
        list.innerHTML = data.recordings.map((r, i) => {
          const start = r.start || '—';
          const end   = r.end   || '—';
          const dur   = duration(r.start, r.end);
          return `
            <div class="rec-item">
              <div class="rec-time">
                ${start} → ${end}
                <span>${dur}</span>
              </div>
              <div class="rec-actions">
                <button onclick="playRecording(${i})">▶ Reproduzir</button>
              </div>
            </div>`;
        }).join('');
      } catch (e) {
        list.innerHTML = '<div class="rec-empty">Erro ao conectar com a câmera.</div>';
      }
    }

    function duration(start, end) {
      try {
        const s = new Date(start.replace(' ', 'T'));
        const e = new Date(end.replace(' ', 'T'));
        const secs = Math.round((e - s) / 1000);
        const m = Math.floor(secs / 60);
        const s2 = secs % 60;
        return `${m}m ${s2}s`;
      } catch { return ''; }
    }

    function playRecording(i) {
      const r = currentRecordings[i];
      if (!r) return;
      const section = document.getElementById('playback-section');
      const pbFeed  = document.getElementById('playback-feed');
      const pbInfo  = document.getElementById('playback-info');
      const overlay = document.getElementById('playback-overlay');

      section.style.display = 'flex';
      pbInfo.textContent = `${r.start} → ${r.end}`;
      overlay.classList.remove('hidden');
      overlay.textContent = 'Preparando gravação (baixando + convertendo, ~1-2 min)...';

      pbFeed.src = '/playback?filename=' + encodeURIComponent(r.filename)
                 + '&start=' + encodeURIComponent(r.start)
                 + '&end=' + encodeURIComponent(r.end);
      pbFeed.onloadeddata = () => { overlay.classList.add('hidden'); pbFeed.play().catch(()=>{}); };
      pbFeed.onerror = () => { overlay.classList.remove('hidden'); overlay.textContent = 'Erro ao preparar a gravação.'; };
      section.scrollIntoView({ behavior: 'smooth' });
    }

    function stopPlayback() {
      const section = document.getElementById('playback-section');
      const pbFeed = document.getElementById('playback-feed');
      pbFeed.pause();
      pbFeed.removeAttribute('src');
      pbFeed.load();
      section.style.display = 'none';
    }
  </script>

</body>
</html>
